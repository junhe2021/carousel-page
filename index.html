<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>头层牛皮软席 - 产品展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .carousel-wrapper {
            position: relative;
            width: 100%;
            padding-top: 133.33%; /* 3:4 aspect ratio */
            overflow: hidden;
        }
        
        .carousel-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        
        .carousel-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }
        
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fff;
        }
        
        .carousel-indicators {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        
        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .indicator.active {
            background: white;
            transform: scale(1.2);
            border-color: #667eea;
        }
        
        .carousel-controls {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            pointer-events: none;
            z-index: 10;
        }
        
        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #333;
            pointer-events: all;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .control-btn:hover {
            background: white;
            transform: scale(1.1);
        }
        
        .info-section {
            padding: 25px;
            text-align: center;
        }
        
        .info-section h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .info-section p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .slide-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 14px;
            z-index: 10;
        }
        
        @media (max-width: 480px) {
            .container {
                border-radius: 15px;
            }
            
            .info-section h1 {
                font-size: 20px;
            }
            
            .control-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="carousel-wrapper">
            <div class="carousel-track" id="carouselTrack">
                <div class="carousel-slide">
                    <img src="images/image1.jpg" alt="头层牛皮软席 - 蓝色花纹款">
                </div>
                <div class="carousel-slide">
                    <img src="images/image2.jpg" alt="头层牛皮软席 - 孔雀花卉款">
                </div>
                <div class="carousel-slide">
                    <img src="images/image3.jpg" alt="头层牛皮软席 - 红色经典款">
                </div>
                <div class="carousel-slide">
                    <img src="images/image4.jpg" alt="头层牛皮软席 - 灰色简约款">
                </div>
                <div class="carousel-slide">
                    <img src="images/image5.jpg" alt="牛皮席保养说明">
                </div>
                <div class="carousel-slide">
                    <img src="images/image6.jpg" alt="Care Instructions">
                </div>
                <div class="carousel-slide">
                    <img src="images/image7.jpg" alt="ຄຳແນະນຳ">
                </div>
            </div>
            
            <div class="slide-counter" id="slideCounter">1 / 7</div>
            
            <div class="carousel-indicators" id="indicators">
                <div class="indicator active" data-index="0"></div>
                <div class="indicator" data-index="1"></div>
                <div class="indicator" data-index="2"></div>
                <div class="indicator" data-index="3"></div>
                <div class="indicator" data-index="4"></div>
                <div class="indicator" data-index="5"></div>
                <div class="indicator" data-index="6"></div>
            </div>
            
            <div class="carousel-controls">
                <button class="control-btn" id="prevBtn">&#10094;</button>
                <button class="control-btn" id="nextBtn">&#10095;</button>
            </div>
        </div>
        
        <div class="info-section">
            <h1>头层牛皮软席</h1>
            <p>高端品质 · 舒适体验 · 经久耐用<br>左右滑动或点击箭头切换图片</p>
        </div>
    </div>

    <script>
        (function() {
            const track = document.getElementById('carouselTrack');
            const indicators = document.querySelectorAll('.indicator');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const counter = document.getElementById('slideCounter');
            const totalSlides = 7;
            
            let currentIndex = 0;
            let autoPlayInterval;
            let touchStartX = 0;
            let touchEndX = 0;
            
            function updateCarousel() {
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
                
                indicators.forEach((indicator, index) => {
                    indicator.classList.toggle('active', index === currentIndex);
                });
                
                counter.textContent = `${currentIndex + 1} / ${totalSlides}`;
            }
            
            function nextSlide() {
                currentIndex = (currentIndex + 1) % totalSlides;
                updateCarousel();
            }
            
            function prevSlide() {
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
                updateCarousel();
            }
            
            function goToSlide(index) {
                currentIndex = index;
                updateCarousel();
            }
            
            function startAutoPlay() {
                autoPlayInterval = setInterval(nextSlide, 3000);
            }
            
            function stopAutoPlay() {
                clearInterval(autoPlayInterval);
            }
            
            // Event listeners
            nextBtn.addEventListener('click', () => {
                stopAutoPlay();
                nextSlide();
                startAutoPlay();
            });
            
            prevBtn.addEventListener('click', () => {
                stopAutoPlay();
                prevSlide();
                startAutoPlay();
            });
            
            indicators.forEach(indicator => {
                indicator.addEventListener('click', () => {
                    stopAutoPlay();
                    goToSlide(parseInt(indicator.dataset.index));
                    startAutoPlay();
                });
            });
            
            // Touch events for swipe
            track.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                stopAutoPlay();
            }, {passive: true});
            
            track.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
                startAutoPlay();
            }, {passive: true});
            
            function handleSwipe() {
                const swipeThreshold = 50;
                const diff = touchStartX - touchEndX;
                
                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        nextSlide();
                    } else {
                        prevSlide();
                    }
                }
            }
            
            // Pause on hover
            track.addEventListener('mouseenter', stopAutoPlay);
            track.addEventListener('mouseleave', startAutoPlay);
            
            // Start autoplay
            startAutoPlay();
            
            // Preload images
            const imageUrls = [
                'images/image1.jpg',
                'images/image2.jpg',
                'images/image3.jpg',
                'images/image4.jpg',
                'images/image5.jpg',
                'images/image6.jpg',
                'images/image7.jpg'
            ];
            
            imageUrls.forEach(url => {
                const img = new Image();
                img.src = url;
            });
        })();
    </script>
</body>
</html>
